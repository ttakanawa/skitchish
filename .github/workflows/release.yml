name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - run: bash scripts/test.sh

  release:
    needs: test
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Import signing certificate and configure notarization
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials skitchish-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build, sign and notarize
        env:
          TAG: ${{ github.ref_name }}
          SKITCHISH_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          SKITCHISH_NOTARY_PROFILE: skitchish-notary
        run: bash scripts/release.sh "${TAG#v}" "$GITHUB_RUN_NUMBER"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published artifacts" >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "Skitchish $version" --generate-notes \
            "build/releases/$version/Skitchish-$version.zip" "build/releases/$version/SHA256SUMS"
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/publish-tap.sh "${TAG#v}"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  # Recover a failed tap update without replacing release artifacts.
  tap-retry:
    if: ${{ failure() && needs.release.result == 'failure' }}
    needs: release
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover tap update from published release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/publish-tap.sh "${TAG#v}"
